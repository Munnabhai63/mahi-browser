<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MAHI BROWSER</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background: #090d16;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      height: 100vh;
      width: 100vw;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border: 1px solid rgba(20, 184, 166, 0.3);
      border-radius: 16px;
      position: relative;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8), 0 0 35px rgba(20, 184, 166, 0.15);
    }
    .background-glow {
      position: absolute;
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(20, 184, 166, 0.25) 0%, rgba(99, 102, 241, 0.15) 50%, transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      animation: pulseGlow 3s ease-in-out infinite alternate;
    }
    @keyframes pulseGlow {
      0% { transform: translate(-50%, -50%) scale(0.85); opacity: 0.6; }
      100% { transform: translate(-50%, -50%) scale(1.15); opacity: 1; }
    }
    .logo-container {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .icon-badge {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, #0d9488 0%, #14b8a6 50%, #06b6d4 100%);
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 12px 30px rgba(20, 184, 166, 0.4), inset 0 2px 4px rgba(255, 255, 255, 0.4);
      font-size: 38px;
      font-weight: 900;
      color: #ffffff;
      letter-spacing: -1px;
      animation: iconFloat 2.5s ease-in-out infinite alternate;
    }
    @keyframes iconFloat {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-6px); }
    }
    .brand-title {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 3px;
      background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 50%, #14b8a6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
    }
    .brand-tagline {
      font-size: 11px;
      font-weight: 600;
      color: #94a3b8;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-top: -8px;
    }
    .progress-bar-container {
      width: 240px;
      height: 4px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 999px;
      margin-top: 28px;
      overflow: hidden;
      position: relative;
    }
    .progress-bar-fill {
      height: 100%;
      width: 35%;
      background: linear-gradient(90deg, #14b8a6, #6366f1, #38bdf8);
      border-radius: 999px;
      position: absolute;
      animation: progressLoop 1.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    @keyframes progressLoop {
      0% { left: -40%; width: 40%; }
      50% { left: 30%; width: 55%; }
      100% { left: 100%; width: 40%; }
    }
    .status-text {
      font-size: 11px;
      color: #64748b;
      margin-top: 14px;
      font-weight: 500;
      letter-spacing: 0.5px;
      height: 16px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .version-tag {
      position: absolute;
      bottom: 12px;
      font-size: 10px;
      color: #475569;
      letter-spacing: 1px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="background-glow"></div>
  <div class="logo-container">
    <img src="icon.png" class="icon-badge" alt="MAHI Browser" draggable="false" style="object-fit: contain; width: 84px; height: 84px; border-radius: 20px; box-shadow: 0 14px 34px rgba(185, 28, 28, 0.45); -webkit-user-drag: none; user-drag: none; user-select: none;" />
    <div class="brand-title">MAHI BROWSER</div>
    <div class="brand-tagline">Enterprise Anti-Detect System</div>
    <div class="progress-bar-container">
      <div class="progress-bar-fill"></div>
    </div>
    <div class="status-text" id="statusText">Initializing Anti-Detect Engine...</div>
  </div>
  <div class="version-tag">VERSION 1.1.1 PRO • PRODUCTION EDITION</div>

  <script>
    const messages = [
      "Initializing Anti-Detect Engine...",
      "Mounting Encrypted Vault...",
      "Verifying Stealth Fingerprint Profiles...",
      "Starting Local Bridge...",
      "Ready!"
    ];
    let msgIdx = 0;
    const statusEl = document.getElementById('statusText');
    const interval = setInterval(() => {
      msgIdx = (msgIdx + 1) % messages.length;
      statusEl.textContent = messages[msgIdx];
    }, 700);
  </script>
</body>
</html>
