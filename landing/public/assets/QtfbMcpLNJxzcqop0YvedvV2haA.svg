<svg xmlns="http://www.w3.org/2000/svg" width="290" height="68" viewBox="0 0 290 68" fill="none">
  <!-- Outer Card Bezel (Black & White Luxury) -->
  <rect x="0.5" y="0.5" width="289" height="67" rx="12" fill="#0C0D12" stroke="rgba(255, 255, 255, 0.16)" stroke-width="1"/>
  
  <!-- Subtle Top Highlight Line -->
  <line x1="14" y1="1" x2="276" y2="1" stroke="rgba(255, 255, 255, 0.22)" stroke-width="1"/>
  
  <!-- Top Row: Mahi Browser (Superior Champion) -->
  <rect x="15" y="14" width="13" height="13" rx="3" stroke="#FFFFFF" stroke-width="1.6" fill="none"/>
  <rect x="19" y="18" width="13" height="13" rx="3" stroke="#FFFFFF" stroke-width="1.6" fill="#0C0D12"/>
  <text x="39" y="27" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="12" font-weight="700" letter-spacing="0.5">MAHI BROWSER</text>
  
  <!-- Luxury Monochrome Pill Badge -->
  <rect x="152" y="13" width="124" height="20" rx="5" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(255, 255, 255, 0.26)" stroke-width="0.8"/>
  <text x="214" y="26.5" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="8.8" font-weight="600" letter-spacing="0.3">✦ UNLIMITED PROFILES</text>
  
  <!-- Hairline Divider -->
  <line x1="15" y1="39" x2="275" y2="39" stroke="rgba(255, 255, 255, 0.10)" stroke-width="1"/>
  
  <!-- Bottom Row: Competitor (Defeated / Strikethrough / Flaw) -->
  <text x="16" y="55" fill="#A1A1AA" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700">✕</text>
  <text x="28" y="55" fill="#9CA3AF" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="500">Octo Browser</text>
  <line x1="28" y1="51" x2="102" y2="51" stroke="rgba(255, 255, 255, 0.45)" stroke-width="1.4"/>
  
  <text x="275" y="55" text-anchor="end" fill="#E4E4E7" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="500" letter-spacing="0.2">Costly Token Limits</text>
</svg>