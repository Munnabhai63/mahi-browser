<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 29">
  <defs>
    <style>
      .txt-m { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; font-weight: 700; fill: #ffffff; letter-spacing: -0.02em; }
      .txt-b { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; font-weight: 400; fill: #e4e4e7; letter-spacing: -0.02em; }
      .badge-bg { fill: rgba(255, 255, 255, 0.1); stroke: rgba(255, 255, 255, 0.15); stroke-width: 0.5px; }
      .badge-txt { font-family: 'JetBrains Mono', monospace; font-size: 7.5px; font-weight: 600; fill: #a1a1aa; }
    </style>
  </defs>
  <!-- Shield Icon -->
  <g transform="translate(1, 2)">
    <rect width="25" height="25" rx="6" fill="#18181b" stroke="rgba(255,255,255,0.22)" stroke-width="1"/>
    <path d="M12.5 6.5 L7.5 8.8 V13 C7.5 16.5 9.8 19.3 12.5 20.2 C15.2 19.3 17.5 16.5 17.5 13 V8.8 Z" fill="none" stroke="#ffffff" stroke-width="1.3" stroke-linejoin="round"/>
    <path d="M10.2 13 L11.8 14.5 L14.8 11.2" fill="none" stroke="#ffffff" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- Brand Text -->
  <text x="33" y="19" class="txt-m">Mahi</text>
  <text x="69" y="19" class="txt-b">Browser</text>
  <!-- v2.0 Badge -->
  <rect x="120" y="9.5" width="22" height="11" rx="3" class="badge-bg"/>
  <text x="124" y="18" class="badge-txt">v2.0</text>
</svg>
