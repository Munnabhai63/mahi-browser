<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3840 2560" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- किनारों को गोल रखने के लिए (Rounded Corners) -->
    <clipPath id="displayFrame">
      <rect x="0" y="0" width="3840" height="2560" rx="16" ry="16" />
    </clipPath>
  </defs>

  <!-- इमेज ग्रुप -->
  <g clip-path="url(#displayFrame)">
    <image href="./mahi_workflow_scale.jpg" x="0" y="0" width="3840" height="2560" preserveAspectRatio="xMidYMid slice" />
  </g>
</svg>