name: CI Verification

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  verify:
    name: Lint, Typecheck & Test Suite
    runs-on: ubuntu-latest
    env:
      CI: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install root dependencies
        run: npm ci

      - name: Install landing dependencies
        run: npm --prefix landing ci

      - name: Lint codebase with Biome
        run: npm run lint

      - name: Typecheck Desktop & Electron
        run: npm run typecheck

      - name: Typecheck Cloud Gateway
        run: npm run build:gateway

      - name: Typecheck Landing Portal
        run: npm run landing:typecheck

      - name: Run full test suite
        run: npm test
