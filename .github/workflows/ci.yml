name: CI Verification

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  verify:
    name: Lint, Typecheck & Test Suite
    runs-on: ubuntu-latest
    env:
      CI: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install root dependencies
        run: npm ci

      - name: Install landing dependencies
        run: npm --prefix landing ci

      - name: Audit production dependencies (High/Critical)
        run: |
          npm audit --omit=dev --audit-level=high
          npm --prefix landing audit --omit=dev --audit-level=high

      - name: Lint codebase with Biome
        run: npm run lint

      - name: Lint landing portal with Biome
        run: npm --prefix landing run lint

      - name: Typecheck Desktop & Electron
        run: npm run typecheck

      - name: Typecheck Cloud Gateway
        run: npm run build:gateway

      - name: Typecheck Landing Portal
        run: npm run landing:typecheck

      - name: Build Landing Portal
        run: npm run landing:build

      - name: Run unit & integration CI suite
        run: npm run test:ci

  e2e-and-stress:
    name: Headless E2E & Stress Suites
    runs-on: ubuntu-latest
    env:
      CI: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install root dependencies
        run: npm ci

      - name: Run headless E2E suite
        run: npm run test:e2e

      - name: Run headless stress suite
        run: npm run test:stress
