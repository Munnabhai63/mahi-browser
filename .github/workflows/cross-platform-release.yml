name: Cross-Platform Release Matrix

on:
  push:
    branches:
      - main
      - 'feature/*'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      include_all_platforms:
        description: 'Build all platforms (macOS, Linux) in addition to Windows'
        type: boolean
        required: false
        default: false
      engine_release_tag:
        description: 'Optional engine-v* GitHub Release tag providing custom nativeStealth Chromium archives (empty = auto-detect latest)'
        type: string
        required: false
        default: ''
      require_native_engine:
        description: 'Fail instead of falling back to stock Chromium if no engine-v* nativeStealth asset is published'
        type: boolean
        required: false
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  resolve-matrix:
    name: Resolve Target Matrix
    runs-on: ubuntu-latest
    outputs:
      test_os: ${{ steps.matrix.outputs.test_os }}
      package_matrix: ${{ steps.matrix.outputs.package_matrix }}
    steps:
      - id: matrix
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]] || { [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.include_all_platforms }}" = "true" ]; }; then
            echo 'test_os=["windows-latest", "macos-latest", "ubuntu-latest"]' >> $GITHUB_OUTPUT
            echo 'package_matrix=[{"os":"windows-latest","platform":"win","arch":"x64","engine_target":"win64","engine_asset":"chrome-win.zip","engine_subdir":"chrome-win"},{"os":"macos-latest","platform":"mac","arch":"arm64","engine_target":"mac-arm64","engine_asset":"chrome-mac-arm64.zip","engine_subdir":"chrome-mac-arm64"},{"os":"ubuntu-latest","platform":"linux","arch":"x64","engine_target":"linux64","engine_asset":"chrome-linux64.zip","engine_subdir":"chrome-linux64"}]' >> $GITHUB_OUTPUT
          else
            echo 'test_os=["windows-latest"]' >> $GITHUB_OUTPUT
            echo 'package_matrix=[{"os":"windows-latest","platform":"win","arch":"x64","engine_target":"win64","engine_asset":"chrome-win.zip","engine_subdir":"chrome-win"}]' >> $GITHUB_OUTPUT
          fi

  test-and-verify:
    name: Test & Typecheck (${{ matrix.os }})
    needs: resolve-matrix
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJson(needs.resolve-matrix.outputs.test_os) }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'

      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libnss3 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1
          sudo apt-get install -y libasound2t64 libatk1.0-0t64 libatk-bridge2.0-0t64 libcups2t64 || sudo apt-get install -y libasound2 libatk1.0-0 libatk-bridge2.0-0 libcups2 || true

      - name: Install NPM Dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build Web & Electron
        run: npm run build

      - name: Verify Next.js Landing Portal Build & Typecheck
        run: |
          cd landing
          npm ci
          npm run typecheck
          npm run build
        shell: bash

      - name: Run CI Test Suite (Linux Xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x960x24" npm run test:ci

      - name: Run CI Test Suite (macOS / Windows)
        if: runner.os != 'Linux'
        run: npm run test:ci

  build-and-package:
    name: Package Desktop (${{ matrix.platform }}-${{ matrix.arch }} on ${{ matrix.os }})
    needs: [resolve-matrix, test-and-verify]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.resolve-matrix.outputs.package_matrix) }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'

      - name: Install System Build Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libnss3 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1
          sudo apt-get install -y libasound2t64 libatk1.0-0t64 libatk-bridge2.0-0t64 libcups2t64 || sudo apt-get install -y libasound2 libatk1.0-0 libatk-bridge2.0-0 libcups2 || true

      - name: Install NPM Dependencies
        run: npm ci

      - name: Build Web & Electron
        run: npm run build

      - name: Verify Next.js Landing Portal Build & Typecheck
        run: |
          cd landing
          npm ci
          npm run typecheck
          npm run build
        shell: bash

      - name: Provision Chromium 138 Engine (nativeStealth Release or Verified Fallback)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ENGINE_ASSET: ${{ matrix.engine_asset }}
          ENGINE_SUBDIR: ${{ matrix.engine_subdir }}
          ENGINE_TARGET: ${{ matrix.engine_target }}
          REQUESTED_ENGINE_TAG: ${{ inputs.engine_release_tag }}
          REQUIRE_NATIVE: ${{ inputs.require_native_engine || vars.STRICT_NATIVE_ENGINE == 'true' }}
        run: |
          set -euo pipefail
          ENGINE_DIR=".mahi_data/engines/138.0.7204.0"
          mkdir -p "$ENGINE_DIR"
          TMP_DIR="$(mktemp -d)"
          trap 'rm -rf "$TMP_DIR"' EXIT

          ENGINE_TAG="${REQUESTED_ENGINE_TAG}"
          if [ -z "$ENGINE_TAG" ]; then
            ENGINE_TAG=$(gh release list --limit 30 --json tagName --jq '[.[] | select(.tagName | startswith("engine-v"))][0].tagName // ""' 2>/dev/null || true)
          fi

          PROVISIONED_NATIVE=0
          if [ -n "$ENGINE_TAG" ]; then
            echo "Checking custom nativeStealth release '$ENGINE_TAG' for ${ENGINE_ASSET}..."
            if gh release download "$ENGINE_TAG" --pattern "$ENGINE_ASSET" --pattern "${ENGINE_ASSET}.sha256" --dir "$TMP_DIR" 2>/dev/null; then
              if [ -f "$TMP_DIR/${ENGINE_ASSET}.sha256" ]; then
                EXPECTED_CUSTOM=$(awk '{print $1}' "$TMP_DIR/${ENGINE_ASSET}.sha256" | tr '[:upper:]' '[:lower:]')
                ACTUAL_CUSTOM=$(sha256sum "$TMP_DIR/$ENGINE_ASSET" | awk '{print $1}' | tr '[:upper:]' '[:lower:]')
                if [ "$ACTUAL_CUSTOM" != "$EXPECTED_CUSTOM" ]; then
                  echo "FATAL: Custom engine SHA-256 mismatch ($ACTUAL_CUSTOM vs $EXPECTED_CUSTOM)"
                  exit 1
                fi
              fi
              unzip -q -o "$TMP_DIR/$ENGINE_ASSET" -d "$TMP_DIR/extract" 2>/dev/null || tar -xf "$TMP_DIR/$ENGINE_ASSET" -C "$TMP_DIR/extract"
              if [ -d "$TMP_DIR/extract/${ENGINE_SUBDIR}" ]; then
                cp -R "$TMP_DIR/extract/${ENGINE_SUBDIR}/." "$ENGINE_DIR/"
              else
                cp -R "$TMP_DIR/extract/." "$ENGINE_DIR/"
              fi
              if [ ! -f "$ENGINE_DIR/mahi-engine.json" ]; then
                echo "FATAL: Custom engine asset ${ENGINE_ASSET} missing mahi-engine.json"
                exit 1
              fi
              echo "[ENGINE] Provisioned verified custom nativeStealth engine (${ENGINE_TAG} -> ${ENGINE_ASSET})."
              PROVISIONED_NATIVE=1
            fi
          fi

          if [ "$PROVISIONED_NATIVE" -eq 0 ]; then
            if [ "$REQUIRE_NATIVE" = "true" ]; then
              echo "::error::No nativeStealth engine asset '${ENGINE_ASSET}' found in any engine-v* GitHub Release (run build-mahi-chromium.yml first)."
              exit 1
            fi

            echo "::warning::No custom nativeStealth engine asset '${ENGINE_ASSET}' published yet; using fallback Chromium provisioning (JS stealth core active). Trigger .github/workflows/build-mahi-chromium.yml for native C++ stealth."

            if [ "${RUNNER_OS}" = "Windows" ]; then
              ZIP_PATH="$TMP_DIR/chrome-win.zip"
              PRIMARY_URL="https://commondatastorage.googleapis.com/chromium-browser-snapshots/Win_x64/1465706/chrome-win.zip"
              FALLBACK_URL="https://mahibrowser.com/engine/chromium-138-win64.zip"
              EXPECTED_SHA256="26237e603d68f909f2ba62162a30c51fa1ba94683ca61358e5489b0a08461bc2"

              echo "Downloading stock Chromium 138 Windows snapshot from $PRIMARY_URL..."
              if ! curl -fsSL --max-time 180 -o "$ZIP_PATH" "$PRIMARY_URL"; then
                echo "Primary download failed, attempting fallback to $FALLBACK_URL..."
                curl -fsSL --max-time 180 -o "$ZIP_PATH" "$FALLBACK_URL"
              fi

              ACTUAL_SHA256=$(sha256sum "$ZIP_PATH" | awk '{print $1}' | tr '[:upper:]' '[:lower:]')
              if [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
                echo "FATAL: Engine archive SHA-256 mismatch ($ACTUAL_SHA256 vs $EXPECTED_SHA256)"
                exit 1
              fi

              mkdir -p "$TMP_DIR/stock"
              unzip -q -o "$ZIP_PATH" -d "$TMP_DIR/stock" 2>/dev/null || tar -xf "$ZIP_PATH" -C "$TMP_DIR/stock"
              cp -R "$TMP_DIR/stock/chrome-win/." "$ENGINE_DIR/"
              if [ ! -f "$ENGINE_DIR/chrome.exe" ]; then
                echo "FATAL: chrome.exe not found after engine extraction"
                exit 1
              fi
              echo "Stock Chromium 138 Windows snapshot provisioned ($(wc -c < "$ENGINE_DIR/chrome.exe") bytes)."
            fi
          fi

      - name: Run Build Info Stamp
        run: node 12_SCRIPTS/stamp-build-info.cjs

      - name: Pre-Stage Packaging Resources
        env:
          MAHI_REQUIRE_BUNDLED_ADB: '1'
        run: node 12_SCRIPTS/stage-packaging-resources.cjs

      - name: Package Target (${{ matrix.platform }})
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "${MAC_CSC_LINK:-}" ]; then
            export CSC_LINK="$MAC_CSC_LINK"
            if [ -n "${MAC_CSC_KEY_PASSWORD:-}" ]; then
              export CSC_KEY_PASSWORD="$MAC_CSC_KEY_PASSWORD"
            else
              unset CSC_KEY_PASSWORD
            fi
          else
            unset CSC_LINK CSC_KEY_PASSWORD
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          for v in APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!v:-}" ]; then
              unset "$v"
            fi
          done
          npm run dist:${{ matrix.platform }}

      - name: Execute Native Smoke Test (Linux Xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x960x24" node 12_SCRIPTS/smoke-test-packaged-app.cjs

      - name: Execute Native Smoke Test (macOS / Windows)
        if: runner.os != 'Linux'
        run: node 12_SCRIPTS/smoke-test-packaged-app.cjs

      - name: Generate Checksums (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          cd release
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS*' -exec shasum -a 256 {} + > "SHA256SUMS-${{ matrix.platform }}-${{ matrix.arch }}.txt" || true

      - name: Normalise release filenames
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $v = (Get-Content package.json | ConvertFrom-Json).version
          Copy-Item "release/MAHI-Browser-Setup-$v.exe" "release/MAHI-Browser-Setup-latest.exe" -Force
          $portable = Get-ChildItem "release/*.exe" | Where-Object { $_.Name -notmatch 'Setup' }
          if ($portable) {
            Copy-Item $portable.FullName "release/MAHI-Browser-Portable-latest.exe" -Force
          }
          Get-ChildItem release | Select-Object Name, Length | Format-Table -AutoSize

      - name: Generate Checksums (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem release\*.exe | Get-FileHash -Algorithm SHA256 | Out-File -FilePath release\SHA256SUMS.txt
          Get-ChildItem release\*-latest.exe -ErrorAction SilentlyContinue |
            Get-FileHash -Algorithm SHA256 |
            Out-File -FilePath release\SHA256SUMS.txt -Append

      - name: Generate latest.json Manifest
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          node 12_SCRIPTS/generate-release-manifest.cjs release
          if (-not (Test-Path release/latest.json)) { throw "Failed to generate release/latest.json" }
          Write-Host "Generated release/latest.json successfully."

      - name: Verify latest.yml matches built installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $v = (Get-Content package.json | ConvertFrom-Json).version
          $setupFile = "release/MAHI-Browser-Setup-$v.exe"
          if (-not (Test-Path $setupFile)) { throw "Missing $setupFile" }
          $stream = [System.IO.File]::OpenRead((Resolve-Path $setupFile))
          $sha512 = [System.Security.Cryptography.SHA512]::Create()
          $hashBytes = $sha512.ComputeHash($stream)
          $stream.Close()
          $actualBase64 = [Convert]::ToBase64String($hashBytes)

          $ymlContent = Get-Content release/latest.yml -Raw
          if ($ymlContent -notmatch 'sha512:\s*([A-Za-z0-9+/=]+)') {
            throw "Cannot find sha512 in release/latest.yml"
          }
          $ymlSha512 = $matches[1]

          Write-Host "Computed SHA512: $actualBase64"
          Write-Host "latest.yml SHA512: $ymlSha512"

          if ($actualBase64 -ne $ymlSha512) {
            throw "FATAL: SHA512 mismatch between $setupFile and release/latest.yml!"
          }
          Write-Host "Integrity Verified: installer SHA512 exactly matches release/latest.yml"

      - name: Assert Blockmap Exists
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $blockmaps = Get-ChildItem release/*.blockmap
          if (-not $blockmaps -or $blockmaps.Count -eq 0) {
            throw "FATAL: No .blockmap file generated in release/"
          }
          Write-Host "Blockmap Verified: $($blockmaps[0].Name)"

      - name: Fail if required release assets are missing
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $v = (Get-Content package.json | ConvertFrom-Json).version
          $required = @(
            "release/MAHI-Browser-Setup-$v.exe",
            "release/MAHI-Browser-Setup-latest.exe",
            "release/MAHI-Browser-Portable-$v.exe",
            "release/MAHI-Browser-Portable-latest.exe",
            "release/MAHI-Browser-Setup-$v.exe.blockmap",
            "release/SHA256SUMS.txt",
            "release/latest.yml",
            "release/latest.json"
          )
          $missing = @()
          foreach ($f in $required) {
            if (-not (Test-Path -LiteralPath $f)) { $missing += $f }
          }
          if ($missing.Count -gt 0) {
            throw ("FATAL: missing required release assets: " + ($missing -join ", "))
          }
          $bm = @(Get-ChildItem -Path release -Filter *.blockmap -ErrorAction SilentlyContinue)
          if ($bm.Count -eq 0) { throw "FATAL: no .blockmap file in release/" }
          $setup = Get-Item -LiteralPath "release/MAHI-Browser-Setup-$v.exe"
          if ($setup.Length -lt 50000000) {
            throw "FATAL: setup exe looks truncated ($($setup.Length) bytes)"
          }
          $json = Get-Content -LiteralPath "release/latest.json" -Raw | ConvertFrom-Json
          if (-not $json.version) { throw "FATAL: latest.json has no version field" }
          if ($json.version -ne $v) {
            throw "FATAL: latest.json version $($json.version) != package.json $v"
          }
          Write-Host "All required release assets present."
          Write-Host "Setup size: $($setup.Length) bytes | latest.json version: $($json.version)"
          Get-ChildItem release | Select-Object Name, Length | Format-Table -AutoSize

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: mahi-browser-${{ matrix.platform }}-${{ matrix.arch }}
          path: release/*
          if-no-files-found: error

  publish-release:
    name: Publish Cross-Platform GitHub Release
    needs: [test-and-verify, build-and-package]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download All Platform Artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: mahi-browser-*
          merge-multiple: true
          path: release

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: MAHI Browser ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            release/MAHI-Browser-Setup-*.exe
            release/MAHI-Browser-Portable-*.exe
            release/MAHI-Browser-*.dmg
            release/MAHI-Browser-*-macOS-*.zip
            release/MAHI-Browser-*.AppImage
            release/MAHI-Browser-*.deb
            release/latest*.yml
            release/latest.json
            release/*.blockmap
            release/SHA256SUMS*.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-vps:
    name: Deploy Release to Production VPS
    needs: [test-and-verify, build-and-package, publish-release]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Download Packaged Artifacts
        uses: actions/download-artifact@v7
        with:
          name: mahi-browser-win-x64
          path: release

      - name: Download Cross-Platform Optional Artifacts (macOS / Linux)
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          pattern: mahi-browser-*
          merge-multiple: true
          path: release-all

      - name: Setup SSH Authentication
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
          PORT: ${{ secrets.VPS_PORT }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p $PORT -H $HOST >> ~/.ssh/known_hosts

      - name: Deploy Binaries & Manifests to VPS
        env:
          HOST: ${{ secrets.VPS_HOST }}
          PORT: ${{ secrets.VPS_PORT }}
          USER: ${{ secrets.VPS_USER }}
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "Deploying release v${VERSION} to production VPS..."

          ls -la release/

          FILES=(
            "release/MAHI-Browser-Setup-${VERSION}.exe"
            "release/MAHI-Browser-Setup-latest.exe"
            "release/MAHI-Browser-Portable-latest.exe"
            "release/MAHI-Browser-Portable-${VERSION}.exe"
            "release/MAHI-Browser-Setup-${VERSION}.exe.blockmap"
            "release/SHA256SUMS.txt"
            "release/latest.json"
            "release/latest.yml"
          )
          for f in "${FILES[@]}"; do
            if [ ! -f "$f" ]; then echo "FATAL: missing required artefact: $f"; exit 1; fi
            echo "present: $f ($(stat -c%s "$f") bytes)"
          done

          ssh -p "$PORT" "$USER@$HOST" "mkdir -p /var/www/mahibrowser/updates /var/www/mahibrowser/releases"

          # 1. binaries first
          scp -P "$PORT" "release/MAHI-Browser-Setup-${VERSION}.exe"          "$USER@$HOST:/var/www/mahibrowser/updates/"
          scp -P "$PORT" "release/MAHI-Browser-Setup-latest.exe"              "$USER@$HOST:/var/www/mahibrowser/releases/"
          scp -P "$PORT" "release/MAHI-Browser-Portable-latest.exe"           "$USER@$HOST:/var/www/mahibrowser/releases/"
          scp -P "$PORT" "release/MAHI-Browser-Portable-${VERSION}.exe"       "$USER@$HOST:/var/www/mahibrowser/updates/"
          scp -P "$PORT" "release/MAHI-Browser-Setup-${VERSION}.exe.blockmap" "$USER@$HOST:/var/www/mahibrowser/updates/"
          scp -P "$PORT" "release/SHA256SUMS.txt"                             "$USER@$HOST:/var/www/mahibrowser/releases/"
          scp -P "$PORT" "release/SHA256SUMS.txt"                             "$USER@$HOST:/var/www/mahibrowser/updates/"

          # 2. optional macOS / Linux installers alongside Windows releases
          if [ -d release-all ]; then
            for xf in release-all/MAHI-Browser-*.dmg release-all/MAHI-Browser-*.AppImage release-all/MAHI-Browser-*.deb release-all/SHA256SUMS-*.txt; do
              if [ -f "$xf" ]; then
                scp -P "$PORT" "$xf" "$USER@$HOST:/var/www/mahibrowser/releases/"
              fi
            done
          fi

          # 3. manifests last, via temp file + atomic rename
          scp -P "$PORT" "release/latest.json" "$USER@$HOST:/var/www/mahibrowser/updates/latest.json.tmp"
          scp -P "$PORT" "release/latest.yml"  "$USER@$HOST:/var/www/mahibrowser/updates/latest.yml.tmp"
          ssh -p "$PORT" "$USER@$HOST" "mv /var/www/mahibrowser/updates/latest.json.tmp /var/www/mahibrowser/updates/latest.json && mv /var/www/mahibrowser/updates/latest.yml.tmp /var/www/mahibrowser/updates/latest.yml"

          # 3. permissions
          ssh -p "$PORT" "$USER@$HOST" "chown -R www-data:www-data /var/www/mahibrowser/updates /var/www/mahibrowser/releases && chmod 755 /var/www/mahibrowser/updates /var/www/mahibrowser/releases && chmod 644 /var/www/mahibrowser/updates/* /var/www/mahibrowser/releases/*"

          echo "Deployment files synced and manifests atomically activated."

      - name: Live Verification Gate
        run: |
          set -euo pipefail
          VERSION=${GITHUB_REF_NAME#v}
          BASE=https://mahibrowser.com
          TMP=$(mktemp -d)
          echo "Verifying live release for v${VERSION}"

          # G1 - endpoints must be 200 and must not be cached
          YML_HDR=$(curl -sS -D - -o "$TMP/latest.yml" "${BASE}/update/latest.yml")
          echo "$YML_HDR" | grep -qi "^HTTP/.* 200" || { echo "FATAL G1: latest.yml not 200"; exit 1; }
          echo "$YML_HDR" | grep -qi "cache-control:.*no-store" || { echo "FATAL G1: latest.yml is cacheable"; exit 1; }

          JSON_HDR=$(curl -sS -D - -o "$TMP/latest.json" "${BASE}/update/latest.json")
          echo "$JSON_HDR" | grep -qi "^HTTP/.* 200" || { echo "FATAL G1: latest.json not 200"; exit 1; }
          echo "$JSON_HDR" | grep -qi "cache-control:.*no-store" || { echo "FATAL G1: latest.json is cacheable"; exit 1; }
          echo "G1 PASS: both manifests 200 and no-store"

          # G2 - both manifests must name this exact version
          YML_VER=$(grep -m1 '^version:' "$TMP/latest.yml" | awk '{print $2}' | tr -d '\r')
          [ "$YML_VER" = "$VERSION" ] || { echo "FATAL G2: latest.yml version=$YML_VER expected=$VERSION"; exit 1; }
          JSON_VER=$(node -e "process.stdout.write(String(require(process.argv[1]).version||''))" "$TMP/latest.json")
          [ "$JSON_VER" = "$VERSION" ] || { echo "FATAL G2: latest.json version=$JSON_VER expected=$VERSION"; exit 1; }
          echo "G2 PASS: both manifests version=$VERSION"

          # G3 and G4 - download the exe the manifest points at, hash it, compare both ways
          EXE_URL="${BASE}/update/MAHI-Browser-Setup-${VERSION}.exe"
          curl -sS -f -o "$TMP/setup.exe" "$EXE_URL" || { echo "FATAL G3: cannot download $EXE_URL"; exit 1; }
          ACTUAL_B64=$(openssl dgst -sha512 -binary "$TMP/setup.exe" | openssl base64 -A)
          YML_B64=$(grep -m1 'sha512:' "$TMP/latest.yml" | sed 's/.*sha512:[[:space:]]*//' | tr -d '\r"')
          [ "$ACTUAL_B64" = "$YML_B64" ] || { echo "FATAL G3: sha512 mismatch"; echo "computed=$ACTUAL_B64"; echo "manifest=$YML_B64"; exit 1; }
          echo "G3 PASS: latest.yml sha512 matches the downloadable exe"

          ACTUAL_SIZE=$(stat -c%s "$TMP/setup.exe")
          YML_SIZE=$(grep -m1 'size:' "$TMP/latest.yml" | head -1 | awk '{print $2}' | tr -d '\r')
          [ "$YML_SIZE" = "$ACTUAL_SIZE" ] || { echo "FATAL G4: size mismatch manifest=$YML_SIZE actual=$ACTUAL_SIZE"; exit 1; }
          echo "G4 PASS: size=$ACTUAL_SIZE matches latest.yml"

          # G5 - the fresh-install endpoint must serve the same bytes
          SETUP_LEN=$(curl -sS -I "${BASE}/download/setup" | grep -i '^content-length:' | tail -1 | tr -d '\r' | awk '{print $2}')
          [ "$SETUP_LEN" = "$ACTUAL_SIZE" ] || { echo "FATAL G5: /download/setup length=$SETUP_LEN expected=$ACTUAL_SIZE"; exit 1; }
          echo "G5 PASS: /download/setup serves the same artefact"

          # G6 - the custom JSON client must be told to fetch the Setup build, not Portable
          JSON_PRIMARY=$(node -e "process.stdout.write(String(require(process.argv[1]).primaryArtifact||''))" "$TMP/latest.json")
          [ "$JSON_PRIMARY" = "MAHI-Browser-Setup-${VERSION}.exe" ] || { echo "FATAL G6: primaryArtifact=$JSON_PRIMARY"; exit 1; }
          echo "G6 PASS: primaryArtifact is the Setup build"

          # Evidence file - written only when every gate passed
          mkdir -p docs/deployment-evidence
          STAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          {
            echo "# Deployment evidence - v${VERSION}"
            echo
            echo "- Timestamp (UTC): ${STAMP}"
            echo "- Tag: ${GITHUB_REF_NAME}"
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo "| Gate | Result | Value |"
            echo "|---|---|---|"
            echo "| G1 both manifests 200 + no-store | PASS | checked |"
            echo "| G2 both manifests version | PASS | ${VERSION} |"
            echo "| G3 latest.yml sha512 vs exe | PASS | ${ACTUAL_B64} |"
            echo "| G4 size vs latest.yml | PASS | ${ACTUAL_SIZE} bytes |"
            echo "| G5 /download/setup length | PASS | ${SETUP_LEN} bytes |"
            echo "| G6 latest.json primaryArtifact | PASS | ${JSON_PRIMARY} |"
          } > "docs/deployment-evidence/${STAMP%%T*}.md"
          echo "Evidence written to docs/deployment-evidence/${STAMP%%T*}.md"
          echo "ALL LIVE GATES PASSED for v${VERSION}"

      - name: Upload Deployment Evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: deployment-evidence-${{ github.ref_name }}
          path: docs/deployment-evidence/*.md
          if-no-files-found: warn
