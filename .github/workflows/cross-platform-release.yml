name: Cross-Platform Release Matrix

on:
  push:
    branches:
      - main
      - 'feature/*'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      include_all_platforms:
        description: 'Build all platforms (macOS, Linux) in addition to Windows'
        type: boolean
        required: false
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  resolve-matrix:
    name: Resolve Target Matrix
    runs-on: ubuntu-latest
    outputs:
      test_os: ${{ steps.matrix.outputs.test_os }}
      package_matrix: ${{ steps.matrix.outputs.package_matrix }}
    steps:
      - id: matrix
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.include_all_platforms }}" = "true" ]; then
            echo 'test_os=["windows-latest", "macos-latest", "ubuntu-latest"]' >> $GITHUB_OUTPUT
            echo 'package_matrix=[{"os":"windows-latest","platform":"win","arch":"x64","artifact_pattern":"release/*.exe"},{"os":"macos-latest","platform":"mac","arch":"arm64","artifact_pattern":"release/*.dmg"},{"os":"ubuntu-latest","platform":"linux","arch":"x64","artifact_pattern":"release/*.AppImage"}]' >> $GITHUB_OUTPUT
          else
            echo 'test_os=["windows-latest"]' >> $GITHUB_OUTPUT
            echo 'package_matrix=[{"os":"windows-latest","platform":"win","arch":"x64","artifact_pattern":"release/*.exe"}]' >> $GITHUB_OUTPUT
          fi

  test-and-verify:
    name: Test & Typecheck (${{ matrix.os }})
    needs: resolve-matrix
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJson(needs.resolve-matrix.outputs.test_os) }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libnss3 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1
          sudo apt-get install -y libasound2t64 libatk1.0-0t64 libatk-bridge2.0-0t64 libcups2t64 || sudo apt-get install -y libasound2 libatk1.0-0 libatk-bridge2.0-0 libcups2 || true

      - name: Install NPM Dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build Web & Electron
        run: npm run build

      - name: Verify Next.js Landing Portal Build & Typecheck
        run: |
          cd landing
          npm ci
          npm run typecheck
          npm run build
        shell: bash

      - name: Run CI Test Suite (Linux Xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x960x24" npm run test:ci

      - name: Run CI Test Suite (macOS / Windows)
        if: runner.os != 'Linux'
        run: npm run test:ci

  build-and-package:
    name: Package Desktop (${{ matrix.platform }}-${{ matrix.arch }} on ${{ matrix.os }})
    needs: [resolve-matrix, test-and-verify]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.resolve-matrix.outputs.package_matrix) }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install System Build Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libnss3 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1
          sudo apt-get install -y libasound2t64 libatk1.0-0t64 libatk-bridge2.0-0t64 libcups2t64 || sudo apt-get install -y libasound2 libatk1.0-0 libatk-bridge2.0-0 libcups2 || true

      - name: Install NPM Dependencies
        run: npm ci

      - name: Build Web & Electron
        run: npm run build

      - name: Verify Next.js Landing Portal Build & Typecheck
        run: |
          cd landing
          npm ci
          npm run typecheck
          npm run build
        shell: bash

      - name: Provision Chromium 138 Engine
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $engineDir = ".mahi_data/engines/138.0.7204.0"
          New-Item -ItemType Directory -Path $engineDir -Force
          $zipPath = "$env:TEMP/chrome-win.zip"
          $primaryUrl = "https://commondatastorage.googleapis.com/chromium-browser-snapshots/Win_x64/1465706/chrome-win.zip"
          $fallbackUrl = "https://mahibrowser.com/engine/chrome-138-win64.zip"
          $expectedSha256 = "26237e603d68f909f2ba62162a30c51fa1ba94683ca61358e5489b0a08461bc2"

          Write-Host "Downloading Chromium 138 engine from $primaryUrl..."
          try {
            Invoke-WebRequest -Uri $primaryUrl -OutFile $zipPath -TimeoutSec 180
          } catch {
            Write-Host "Primary download failed, attempting fallback to $fallbackUrl..."
            Invoke-WebRequest -Uri $fallbackUrl -OutFile $zipPath -TimeoutSec 180
          }

          $hash = (Get-FileHash -Algorithm SHA256 $zipPath).Hash.ToLower()
          Write-Host "Downloaded hash: $hash"
          if ($hash -ne $expectedSha256) {
            throw "FATAL: Engine archive SHA-256 mismatch ($hash vs $expectedSha256)"
          }

          Write-Host "Extracting engine to $engineDir..."
          Expand-Archive -Path $zipPath -DestinationPath "$env:TEMP/engine_extract" -Force
          Copy-Item -Path "$env:TEMP/engine_extract/chrome-win/*" -Destination $engineDir -Recurse -Force
          if (-not (Test-Path "$engineDir/chrome.exe")) {
            throw "FATAL: chrome.exe not found after engine extraction"
          }
          Write-Host "Chromium 138 engine successfully provisioned ($(Get-Item "$engineDir/chrome.exe").Length bytes)"

      - name: Run Build Info Stamp
        run: node 12_SCRIPTS/stamp-build-info.cjs

      - name: Pre-Stage Packaging Resources
        run: node 12_SCRIPTS/stage-packaging-resources.cjs

      - name: Package Target (${{ matrix.platform }})
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run dist:${{ matrix.platform }}

      - name: Execute Native Smoke Test (Linux Xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x960x24" node 12_SCRIPTS/smoke-test-packaged-app.cjs

      - name: Execute Native Smoke Test (macOS / Windows)
        if: runner.os != 'Linux'
        run: node 12_SCRIPTS/smoke-test-packaged-app.cjs

      - name: Generate Checksums (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          cd release && shasum -a 256 * > SHA256SUMS.txt || true

      - name: Generate Checksums (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem release\*.exe | Get-FileHash -Algorithm SHA256 | Out-File -FilePath release\SHA256SUMS.txt

      - name: Normalise release filenames
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $v = (Get-Content package.json | ConvertFrom-Json).version
          Copy-Item "release/MAHI-Browser-Setup-$v.exe" "release/MAHI-Browser-Setup-latest.exe" -Force
          $portable = Get-ChildItem "release/*.exe" | Where-Object { $_.Name -notmatch 'Setup' }
          if ($portable) {
            Copy-Item $portable.FullName "release/MAHI-Browser-Portable-latest.exe" -Force
          }
          Get-ChildItem release | Select-Object Name, Length | Format-Table -AutoSize

      - name: Generate latest.json Manifest
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          node 12_SCRIPTS/generate-release-manifest.cjs release
          if (-not (Test-Path release/latest.json)) { throw "Failed to generate release/latest.json" }
          Write-Host "Generated release/latest.json successfully."

      - name: Verify latest.yml matches built installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $v = (Get-Content package.json | ConvertFrom-Json).version
          $setupFile = "release/MAHI-Browser-Setup-$v.exe"
          if (-not (Test-Path $setupFile)) { throw "Missing $setupFile" }
          $stream = [System.IO.File]::OpenRead((Resolve-Path $setupFile))
          $sha512 = [System.Security.Cryptography.SHA512]::Create()
          $hashBytes = $sha512.ComputeHash($stream)
          $stream.Close()
          $actualBase64 = [Convert]::ToBase64String($hashBytes)

          $ymlContent = Get-Content release/latest.yml -Raw
          if ($ymlContent -notmatch 'sha512:\s*([A-Za-z0-9+/=]+)') {
            throw "Cannot find sha512 in release/latest.yml"
          }
          $ymlSha512 = $matches[1]

          Write-Host "Computed SHA512: $actualBase64"
          Write-Host "latest.yml SHA512: $ymlSha512"

          if ($actualBase64 -ne $ymlSha512) {
            throw "FATAL: SHA512 mismatch between $setupFile and release/latest.yml!"
          }
          Write-Host "Integrity Verified: installer SHA512 exactly matches release/latest.yml"

      - name: Assert Blockmap Exists
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $blockmaps = Get-ChildItem release/*.blockmap
          if (-not $blockmaps -or $blockmaps.Count -eq 0) {
            throw "FATAL: No .blockmap file generated in release/"
          }
          Write-Host "Blockmap Verified: $($blockmaps[0].Name)"

      - name: Fail if required release assets are missing
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $v = (Get-Content package.json | ConvertFrom-Json).version
          $required = @(
            "release/MAHI-Browser-Setup-$v.exe",
            "release/MAHI-Browser-Setup-latest.exe",
            "release/MAHI-Browser-Portable-latest.exe",
            "release/latest.yml",
            "release/latest.json"
          )
          $missing = @()
          foreach ($f in $required) {
            if (-not (Test-Path -LiteralPath $f)) { $missing += $f }
          }
          if ($missing.Count -gt 0) {
            throw ("FATAL: missing required release assets: " + ($missing -join ", "))
          }
          $bm = @(Get-ChildItem -Path release -Filter *.blockmap -ErrorAction SilentlyContinue)
          if ($bm.Count -eq 0) { throw "FATAL: no .blockmap file in release/" }
          $setup = Get-Item -LiteralPath "release/MAHI-Browser-Setup-$v.exe"
          if ($setup.Length -lt 50000000) {
            throw "FATAL: setup exe looks truncated ($($setup.Length) bytes)"
          }
          $json = Get-Content -LiteralPath "release/latest.json" -Raw | ConvertFrom-Json
          if (-not $json.version) { throw "FATAL: latest.json has no version field" }
          if ($json.version -ne $v) {
            throw "FATAL: latest.json version $($json.version) != package.json $v"
          }
          Write-Host "All required release assets present."
          Write-Host "Setup size: $($setup.Length) bytes | latest.json version: $($json.version)"
          Get-ChildItem release | Select-Object Name, Length | Format-Table -AutoSize

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mahi-browser-${{ matrix.platform }}-${{ matrix.arch }}
          path: release/*
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') && runner.os == 'Windows'
        uses: softprops/action-gh-release@v2
        with:
          name: MAHI Browser ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            release/MAHI-Browser-Setup-*.exe
            release/MAHI-Browser-Portable-*.exe
            release/latest.yml
            release/latest.json
            release/*.blockmap
            release/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-vps:
    name: Deploy Release to Production VPS
    needs: [test-and-verify, build-and-package]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Packaged Artifacts
        uses: actions/download-artifact@v4
        with:
          name: mahi-browser-win-x64
          path: release

      - name: Setup SSH Authentication
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
          PORT: ${{ secrets.VPS_PORT }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p $PORT -H $HOST >> ~/.ssh/known_hosts

      - name: Deploy Binaries & Manifests to VPS
        env:
          HOST: ${{ secrets.VPS_HOST }}
          PORT: ${{ secrets.VPS_PORT }}
          USER: ${{ secrets.VPS_USER }}
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "Deploying release v${VERSION} to production VPS..."

          ls -la release/

          FILES=(
            "release/MAHI-Browser-Setup-${VERSION}.exe"
            "release/MAHI-Browser-Setup-latest.exe"
            "release/MAHI-Browser-Portable-latest.exe"
            "release/MAHI-Browser-Portable-${VERSION}.exe"
            "release/MAHI-Browser-Setup-${VERSION}.exe.blockmap"
            "release/SHA256SUMS.txt"
            "release/latest.json"
            "release/latest.yml"
          )
          for f in "${FILES[@]}"; do
            if [ ! -f "$f" ]; then echo "FATAL: missing required artefact: $f"; exit 1; fi
            echo "present: $f ($(stat -c%s "$f") bytes)"
          done

          ssh -p "$PORT" "$USER@$HOST" "mkdir -p /var/www/mahibrowser/updates /var/www/mahibrowser/releases"

          # 1. binaries first
          scp -P "$PORT" "release/MAHI-Browser-Setup-${VERSION}.exe"          "$USER@$HOST:/var/www/mahibrowser/updates/"
          scp -P "$PORT" "release/MAHI-Browser-Setup-latest.exe"              "$USER@$HOST:/var/www/mahibrowser/releases/"
          scp -P "$PORT" "release/MAHI-Browser-Portable-latest.exe"           "$USER@$HOST:/var/www/mahibrowser/releases/"
          scp -P "$PORT" "release/MAHI-Browser-Portable-${VERSION}.exe"       "$USER@$HOST:/var/www/mahibrowser/updates/"
          scp -P "$PORT" "release/MAHI-Browser-Setup-${VERSION}.exe.blockmap" "$USER@$HOST:/var/www/mahibrowser/updates/"
          scp -P "$PORT" "release/SHA256SUMS.txt"                             "$USER@$HOST:/var/www/mahibrowser/releases/"
          scp -P "$PORT" "release/SHA256SUMS.txt"                             "$USER@$HOST:/var/www/mahibrowser/updates/"

          # 2. manifests last, via temp file + atomic rename
          scp -P "$PORT" "release/latest.json" "$USER@$HOST:/var/www/mahibrowser/updates/latest.json.tmp"
          scp -P "$PORT" "release/latest.yml"  "$USER@$HOST:/var/www/mahibrowser/updates/latest.yml.tmp"
          ssh -p "$PORT" "$USER@$HOST" "mv /var/www/mahibrowser/updates/latest.json.tmp /var/www/mahibrowser/updates/latest.json && mv /var/www/mahibrowser/updates/latest.yml.tmp /var/www/mahibrowser/updates/latest.yml"

          # 3. permissions
          ssh -p "$PORT" "$USER@$HOST" "chown -R www-data:www-data /var/www/mahibrowser/updates /var/www/mahibrowser/releases && chmod 755 /var/www/mahibrowser/updates /var/www/mahibrowser/releases && chmod 644 /var/www/mahibrowser/updates/* /var/www/mahibrowser/releases/*"

          echo "Deployment files synced and manifests atomically activated."

      - name: Live Verification Gate
        run: |
          echo "Verifying live HTTP endpoints..."
          VERSION=${GITHUB_REF_NAME#v}

          # 1. Check latest.yml
          YML_CODE=$(curl -s -o /dev/null -w "%{http_code}" https://mahibrowser.com/update/latest.yml)
          if [ "$YML_CODE" -ne 200 ]; then
            echo "FATAL: https://mahibrowser.com/update/latest.yml returned $YML_CODE"
            exit 1
          fi
          echo "✓ latest.yml: HTTP 200"

          # 2. Check latest.json
          JSON_CODE=$(curl -s -o /dev/null -w "%{http_code}" https://mahibrowser.com/update/latest.json)
          if [ "$JSON_CODE" -ne 200 ]; then
            echo "FATAL: https://mahibrowser.com/update/latest.json returned $JSON_CODE"
            exit 1
          fi
          echo "✓ latest.json: HTTP 200"

          # 3. Check Setup download
          SETUP_CODE=$(curl -s -o /dev/null -w "%{http_code}" https://mahibrowser.com/download/setup)
          if [ "$SETUP_CODE" -ne 200 ]; then
            echo "FATAL: https://mahibrowser.com/download/setup returned $SETUP_CODE"
            exit 1
          fi
          echo "✓ setup endpoint: HTTP 200"

          # 4. Check that version in latest.yml matches
          LIVE_YML=$(curl -s https://mahibrowser.com/update/latest.yml)
          if ! echo "$LIVE_YML" | grep -q "version: $VERSION"; then
            echo "FATAL: latest.yml does not contain version $VERSION!"
            exit 1
          fi
          echo "✓ latest.yml verified version: $VERSION"

          # 5. Check that version in latest.json matches
          LIVE_JSON=$(curl -s https://mahibrowser.com/update/latest.json)
          if ! echo "$LIVE_JSON" | grep -q "\"version\": \"$VERSION\""; then
            echo "FATAL: latest.json does not contain version $VERSION!"
            exit 1
          fi
          echo "✓ latest.json verified version: $VERSION"

          echo "All live verification gates PASSED! Release v${VERSION} is live and active."
