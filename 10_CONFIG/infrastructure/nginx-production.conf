# ==============================================================================
# MAHI BROWSER — PRODUCTION EDGE NGINX REVERSE PROXY & WAF CONFIGURATION
# Production Domains: api.mahibrowser.com, app.mahibrowser.com, admin.mahibrowser.com
# ==============================================================================

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_rate_limit:20m rate=50r/s;
limit_req_zone $binary_remote_addr zone=auth_rate_limit:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# Upstream Backend Nodes
upstream mahi_api_backend {
    server 127.0.0.1:8989 max_fails=3 fail_timeout=10s;
    keepalive 64;
}

upstream mahi_cloud_stream {
    server 127.0.0.1:32123 max_fails=3 fail_timeout=10s;
    keepalive 64;
}

# ------------------------------------------------------------------------------
# 1. API GATEWAY: api.mahibrowser.com
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name api.mahibrowser.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.mahibrowser.com;

    # SSL / TLS 1.3 Configuration
    ssl_certificate /etc/letsencrypt/live/mahibrowser.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mahibrowser.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:50m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS & Security Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Edge WAF & Concurrency Limits
    limit_conn conn_limit 30;
    limit_req zone=api_rate_limit burst=100 nodelay;

    client_max_body_size 250M; # Max profile upload limit 200MB + envelope overhead

    # Authentication rate limiting tier
    location ~* ^/api/v1/(auth|central-auth)/(login|register|forgot-password) {
        limit_req zone=auth_rate_limit burst=10 nodelay;
        proxy_pass http://mahi_api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cloud Browser WebSocket Streaming (/stream/*)
    location /stream/ {
        proxy_pass http://mahi_cloud_stream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Default API endpoints
    location / {
        proxy_pass http://mahi_api_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
    }
}

# ------------------------------------------------------------------------------
# 2. WEB MANAGEMENT DASHBOARD: app.mahibrowser.com
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name app.mahibrowser.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.mahibrowser.com;

    ssl_certificate /etc/letsencrypt/live/mahibrowser.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mahibrowser.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    root /var/www/mahibrowser/dashboard/dist;
    index index.html;

    # Static assets caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|wasm)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA history fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ------------------------------------------------------------------------------
# 3. PUBLIC WEBSITE & DIRECT DOWNLOAD DISTRIBUTION: mahibrowser.com
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name mahibrowser.com www.mahibrowser.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mahibrowser.com www.mahibrowser.com;

    ssl_certificate /etc/letsencrypt/live/mahibrowser.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mahibrowser.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    root /var/www/mahibrowser/landing;
    index index.html;

    # Public direct Windows installer download (No auth gate)
    location = /download/setup {
        alias /var/www/mahibrowser/releases/MAHI-Browser-Setup-latest.exe;
        default_type application/octet-stream;
        add_header Content-Disposition 'attachment; filename="MAHI-Browser-Setup-latest.exe"';
        add_header Cache-Control "public, max-age=3600";
    }

    # Public direct portable executable download (No auth gate)
    location = /download/portable {
        alias /var/www/mahibrowser/releases/MAHI-Browser-Portable-latest.exe;
        default_type application/octet-stream;
        add_header Content-Disposition 'attachment; filename="MAHI-Browser-Portable-latest.exe"';
        add_header Cache-Control "public, max-age=3600";
    }

    # Auto-Updater manifest, blockmap, and binary distribution
    location ^~ /update/ {
        alias /var/www/mahibrowser/updates/;
        autoindex off;

        # Manifests and integrity hashes must NEVER be cached
        location ~* \.(ya?ml|json)$ {
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
            add_header Pragma "no-cache";
            expires off;
        }

        # Installers, zip, and blockmap files can be cached
        location ~* \.(exe|zip|dmg|AppImage|deb|rpm|blockmap)$ {
            add_header Cache-Control "public, max-age=86400";
        }
    }

    # Static releases directory
    location /releases/ {
        alias /var/www/mahibrowser/releases/;
        autoindex off;
        add_header Cache-Control "public, max-age=3600";
    }

    # Static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|mp4|webm)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # API Backend Reverse Proxy (Relative calls from landing website)
    location ^~ /api/ {
        proxy_pass http://mahi_api_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /v1/ {
        proxy_pass http://mahi_api_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }
}

# ------------------------------------------------------------------------------
# 4. SUPER ADMIN PANEL GATEWAY: admin.mahibrowser.com
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name admin.mahibrowser.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.mahibrowser.com;

    ssl_certificate /etc/letsencrypt/live/mahibrowser.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mahibrowser.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
    }
}


